name: rredact

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rredact for integration tests
        run: cargo build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/opencode-rredact/package-lock.json
      - name: Install plugin dependencies
        working-directory: packages/opencode-rredact
        run: npm ci
      - name: Typecheck plugin
        working-directory: packages/opencode-rredact
        run: npm run typecheck
      - name: Test plugin
        working-directory: packages/opencode-rredact
        run: npm test

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Scan repository
        id: scan
        continue-on-error: true
        run: |
          ./target/release/rredact scan . \
            --format sarif \
            --output rredact.sarif \
            --fail-on high
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rredact.sarif
      - name: Fail on findings or scan errors
        if: steps.scan.outcome == 'failure'
        run: exit 1

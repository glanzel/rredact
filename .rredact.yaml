# Project configuration for the rredact repository itself.
version: 1
builtin: [secrets, env]

skip_paths:
  - ".git/**"
  - "target/**"
  - "tests/**"
  - ".rredact/**"
  - "defaults/**"
  - "README.md"
  - "docs/**"
  - "examples/**"
  - ".opencode/**"
  - "data/**"
  - "LICENSE"
  - "packages/*/test/**"
  - "packages/*/package-lock.json"
  - "*.bak"
  - "*.orig"

# Contains original values. Never commit this file.
mapping: .rredact/mapping.json
baseline: .rredact/baseline.json
fail_on: high

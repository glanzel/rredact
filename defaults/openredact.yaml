version: 1
metadata:
  generator: rredact rules import
  license: MIT
  source: https://github.com/openredact/nerwhal/archive/refs/heads/develop.tar.gz
rules:
- id: openredact-phone
  description: Recognize phone numbers that follow several common German national and international patterns.
  category: pii
  severity: medium
  type: regex
  pattern: (?:^|^[^\.\d]|[^\d][^\.\d])((\(?(\+|00)\)?\d{1,3}[ \.\-]?)?(\(?0\)?[ ]?\d{1,4}|\(?\d{1,5}\)?)([ -]|([ ]?\/[ ]?))?\d{1,4}[ -]?\d{1,4}[ -]?\d{1,2}([ ]?-[ ]?\d{1,3}|[ ]\d{0,3}[ ]?\/[ ]?\d{1,3})?)(?:$|[^\d]$|[^\d][^\d])
  flags: null
  group: 1
  strip_quotes: false
  placeholder: PHONE
  priority: 80
  enabled: true
  paths: []
  exclude_paths: []
  tags:
  - openredact
  - phonenumberrecognizer
  validate: phone
  name_pattern: null
  name_match: search
  allow_keys: []
  bare_values: auto
  min_length: 32
  min_entropy: 4.0
  charset: base64
- id: openredact-email
  description: Recognize email addresses in the most common formats.
  category: pii
  severity: high
  type: regex
  pattern: '[a-zA-Z0-9!#$%&''"*+\-/=?^_`{|}~][a-zA-Z0-9!#$%&''"*+\-/=?^_`{|}~\.]*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}'
  flags: null
  group: null
  strip_quotes: false
  placeholder: EMAIL
  priority: 80
  enabled: true
  paths: []
  exclude_paths: []
  tags:
  - openredact
  - emailrecognizer
  validate: email
  name_pattern: null
  name_match: search
  allow_keys: []
  bare_values: auto
  min_length: 32
  min_entropy: 4.0
  charset: base64

# rredact built-in secret rules.
# These are intentionally conservative and only match well-known token formats.
# Project-specific rules belong in .rredact/rules.d/*.yaml.
version: 1
rules:
  - id: aws-access-key
    description: AWS access key ID
    category: secret
    severity: critical
    pattern: '\b(?:AKIA|ASIA|AIDA|AROA|AIPA|ANPA|ANVA|ASCA)[A-Z0-9]{16}\b'
    placeholder: AWS_ACCESS_KEY
    priority: 10
    tags: [aws, cloud]

  - id: github-token
    description: GitHub personal access or app token
    category: secret
    severity: critical
    pattern: '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b'
    placeholder: GITHUB_TOKEN
    priority: 10
    tags: [github, vcs]

  - id: github-fine-grained-token
    description: GitHub fine-grained personal access token
    category: secret
    severity: critical
    pattern: '\bgithub_pat_[A-Za-z0-9_]{60,}\b'
    placeholder: GITHUB_PAT
    priority: 10
    tags: [github, vcs]

  - id: gitlab-token
    description: GitLab personal access token
    category: secret
    severity: critical
    pattern: '\bglpat-[A-Za-z0-9_-]{20,}\b'
    placeholder: GITLAB_TOKEN
    priority: 10
    tags: [gitlab, vcs]

  - id: slack-token
    description: Slack bot, user or app token
    category: secret
    severity: critical
    pattern: '\bxox[abposr]-[A-Za-z0-9-]{10,}\b'
    placeholder: SLACK_TOKEN
    priority: 10
    tags: [slack]

  - id: slack-webhook
    description: Slack incoming webhook URL
    category: secret
    severity: high
    pattern: 'https://hooks\.slack\.com/services/[A-Za-z0-9/_-]{20,}'
    placeholder: SLACK_WEBHOOK
    priority: 10
    tags: [slack]

  - id: stripe-secret-key
    description: Stripe secret or restricted key
    category: secret
    severity: critical
    pattern: '\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\b'
    placeholder: STRIPE_KEY
    priority: 10
    tags: [stripe, payment]

  - id: openai-api-key
    description: OpenAI API key
    category: secret
    severity: critical
    pattern: '\bsk-(?:proj-|svcacct-)?[A-Za-z0-9_-]{20,}\b'
    placeholder: OPENAI_API_KEY
    priority: 10
    tags: [openai, llm]

  - id: anthropic-api-key
    description: Anthropic API key
    category: secret
    severity: critical
    pattern: '\bsk-ant-[A-Za-z0-9_-]{20,}\b'
    placeholder: ANTHROPIC_API_KEY
    priority: 9
    tags: [anthropic, llm]

  - id: google-api-key
    description: Google API key
    category: secret
    severity: high
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
    placeholder: GOOGLE_API_KEY
    priority: 10
    tags: [google, cloud]

  - id: google-oauth-client-secret
    description: Google OAuth client secret
    category: secret
    severity: high
    pattern: '\bGOCSPX-[A-Za-z0-9_-]{28,}\b'
    placeholder: GOOGLE_CLIENT_SECRET
    priority: 10
    tags: [google, oauth]

  - id: sendgrid-api-key
    description: SendGrid API key
    category: secret
    severity: critical
    pattern: '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b'
    placeholder: SENDGRID_API_KEY
    priority: 10
    tags: [sendgrid, email]

  - id: npm-token
    description: npm access token
    category: secret
    severity: high
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'
    placeholder: NPM_TOKEN
    priority: 10
    tags: [npm]

  - id: pypi-token
    description: PyPI API token
    category: secret
    severity: high
    pattern: '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}\b'
    placeholder: PYPI_TOKEN
    priority: 10
    tags: [pypi]

  - id: jwt
    description: JSON Web Token
    category: credential
    severity: high
    pattern: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    placeholder: JWT
    priority: 10
    tags: [jwt, auth]

  - id: private-key-block
    description: PEM private key block
    category: secret
    severity: critical
    pattern: |-
      -----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----[\s\S]+?-----END (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----
    placeholder: PRIVATE_KEY
    priority: 5
    tags: [pem, private-key]

  - id: telegram-bot-token
    description: Telegram bot token
    category: secret
    severity: high
    pattern: '\b\d{8,10}:[A-Za-z0-9_-]{35}\b'
    placeholder: TELEGRAM_BOT_TOKEN
    priority: 10
    tags: [telegram]

  - id: discord-bot-token
    description: Discord bot token
    category: secret
    severity: high
    pattern: '\b[MN][A-Za-z\d]{23}\.[\w-]{6}\.[\w-]{27,}\b'
    placeholder: DISCORD_BOT_TOKEN
    priority: 10
    tags: [discord]

  - id: twilio-api-key
    description: Twilio API key SID
    category: secret
    severity: high
    pattern: '\bSK[0-9a-fA-F]{32}\b'
    placeholder: TWILIO_API_KEY
    priority: 10
    tags: [twilio]

  - id: hashicorp-vault-token
    description: HashiCorp Vault service token
    category: secret
    severity: critical
    pattern: '\bhvs\.[A-Za-z0-9_-]{20,}\b'
    placeholder: VAULT_TOKEN
    priority: 10
    tags: [vault, hashicorp]

  - id: digitalocean-token
    description: DigitalOcean personal access token
    category: secret
    severity: critical
    pattern: '\bdop_v1_[a-f0-9]{64}\b'
    placeholder: DIGITALOCEAN_TOKEN
    priority: 10
    tags: [digitalocean, cloud]

  - id: shopify-token
    description: Shopify access token
    category: secret
    severity: high
    pattern: '\bshp(?:at|ca|pa|ss)_[a-fA-F0-9]{32}\b'
    placeholder: SHOPIFY_TOKEN
    priority: 10
    tags: [shopify]

  - id: facebook-access-token
    description: Facebook/Meta access token
    category: secret
    severity: high
    pattern: '\bEAA[A-Za-z0-9]{60,}\b'
    placeholder: FACEBOOK_TOKEN
    priority: 10
    tags: [facebook, meta]

  - id: netlify-token
    description: Netlify personal access token
    category: secret
    severity: high
    pattern: '\bnfp_[A-Za-z0-9]{40}\b'
    placeholder: NETLIFY_TOKEN
    priority: 10
    tags: [netlify]

  - id: high-entropy-token
    description: Long high-entropy token (opt-in, can produce false positives)
    category: secret
    severity: medium
    type: entropy
    min_length: 32
    min_entropy: 4.2
    charset: base64
    placeholder: HIGH_ENTROPY
    priority: 900
    enabled: false
    tags: [entropy]

# PII rules adapted from the OpenRedact / nerwhal recognizers (MIT).
# Source: https://github.com/openredact/nerwhal (moved to
# https://gitlab.opencode.de/bmbf/datenlabor/openredact)
#
# OpenRedact's statistical NER (names, organisations, locations) is not
# included on purpose: that needs a model.  The regex recognizers below are
# useful defaults and can be extended via .rredact/rules.d/*.yaml.
version: 1
metadata:
  source: https://github.com/openredact/nerwhal
  license: MIT
rules:
  - id: openredact-email
    description: Email address (OpenRedact recognizer)
    category: pii
    severity: medium
    pattern: |-
      [a-zA-Z0-9!#$%&'"*+\-/=?^_`{|}~][a-zA-Z0-9!#$%&'"*+\-/=?^_`{|}~\.]*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}
    placeholder: EMAIL
    priority: 80
    tags: [openredact, email]

  - id: openredact-phone
    description: German/international phone number (OpenRedact recognizer)
    category: pii
    severity: medium
    pattern: |-
      ((?:\+?\d{1,3}[\x20.-]?)?(?:\(?0\)?[\x20.-]?\d{1,5}\)?[\x20.-]?)?\d{1,4}[\x20.-]?\d{1,4}(?:[\x20.-]?\d{1,4})?)
    flags: x
    group: 1
    validate: phone
    placeholder: PHONE
    priority: 80
    tags: [openredact, phone]

  - id: openredact-iban
    description: IBAN (validated with MOD-97)
    category: pii
    severity: high
    pattern: '\b[A-Z]{2}\d{2}(?:\x20?[A-Z0-9]{4}){2,7}(?:\x20?[A-Z0-9]{1,4})?\b'
    validate: iban
    placeholder: IBAN
    priority: 70
    tags: [openredact, finance]

  - id: openredact-credit-card
    description: Payment card number (validated with Luhn)
    category: pii
    severity: high
    pattern: '\b(?:\d[\x20-]?){13,19}\b'
    validate: luhn
    placeholder: CREDIT_CARD
    priority: 70
    tags: [openredact, finance]

  - id: openredact-date
    description: German/ISO date (enable for document redaction)
    category: pii
    severity: low
    pattern: |-
      \b(?:(?:0?[1-9]|[12][0-9]|3[01])\.(?:0?[1-9]|1[0-2])\.(?:[12][0-9]{3}|[0-9]{2})|[12][0-9]{3}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])|(?:Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag),?\s+(?:0?[1-9]|[12][0-9]|3[01])\.\s*(?:Jan|Feb|Mrz|Mär|Apr|Mai|Jun|Jul|Aug|Sep|Okt|Nov|Dez)[a-z]*\.?\s+[0-9]{2,4})\b
    placeholder: DATE
    priority: 80
    enabled: false
    tags: [openredact, date]

  - id: openredact-address
    description: German street address (enable for document redaction)
    category: pii
    severity: low
    pattern: '\b[A-ZÄÖÜ][a-zäöüß.-]+(?:straße|str\.|weg|platz|allee|gasse)\s+\d+[a-zA-Z]?\b'
    flags: i
    placeholder: ADDRESS
    priority: 80
    enabled: false
    tags: [openredact, address]

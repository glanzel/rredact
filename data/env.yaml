# Contextual rules: these use the variable/key name as a signal.
# The assignment rule is what catches .env files, e.g.:
#
#   STRIPE_SECRET_KEY=sk_live_<value>
#   DATABASE_PASSWORD="..."
#   "client_secret": "..."
version: 1
rules:
  - id: sensitive-variable-assignment
    description: Value assigned to a secret-looking variable name
    category: secret
    severity: high
    type: assignment
    name_pattern: '(?i)(?:^|[_.-])(?:secret|token|passw(?:or)?d|pwd|api[_-]?key|access[_-]?key|private[_-]?key|client[_-]?secret|credential|auth|authorization|auth[_-]?token|auth[_-]?key|signing[_-]?key|encryption[_-]?key|salt|dsn|database[_-]?url|connection[_-]?string|session[_-]?secret|webhook[_-]?url)(?:$|[_.-])'
    name_match: search
    bare_values: auto
    placeholder: ENV_SECRET
    priority: 200
    tags: [env, assignment]

  - id: sensitive-code-string-assignment
    description: Quoted secret assigned in source code
    category: secret
    severity: high
    pattern: |-
      (?i)\b[A-Za-z0-9_.-]*(?:secret|token|passw(?:or)?d|pwd|api[_-]?key|access[_-]?key|private[_-]?key|client[_-]?secret|credential|authorization|auth[_-]?token|auth[_-]?key|signing[_-]?key|encryption[_-]?key|salt|dsn|database[_-]?url|connection[_-]?string|session[_-]?secret|webhook[_-]?url)[A-Za-z0-9_.-]*\s*(?::\s*[^=\n]+)?=\s*("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')
    flags: x
    group: 1
    strip_quotes: true
    placeholder: ENV_SECRET
    priority: 195
    paths:
      - "*.py"
      - "**/*.py"
      - "*.pyi"
      - "**/*.pyi"
      - "*.js"
      - "**/*.js"
      - "*.jsx"
      - "**/*.jsx"
      - "*.ts"
      - "**/*.ts"
      - "*.tsx"
      - "**/*.tsx"
      - "*.mjs"
      - "**/*.mjs"
      - "*.cjs"
      - "**/*.cjs"
      - "*.go"
      - "**/*.go"
      - "*.rs"
      - "**/*.rs"
      - "*.java"
      - "**/*.java"
      - "*.kt"
      - "**/*.kt"
      - "*.rb"
      - "**/*.rb"
      - "*.php"
      - "**/*.php"
      - "*.cs"
      - "**/*.cs"
      - "*.c"
      - "**/*.c"
      - "*.cc"
      - "**/*.cc"
      - "*.cpp"
      - "**/*.cpp"
      - "*.h"
      - "**/*.h"
      - "*.swift"
      - "**/*.swift"
      - "*.sh"
      - "**/*.sh"
      - "*.bash"
      - "**/*.bash"
      - "*.zsh"
      - "**/*.zsh"
      - "*.ps1"
      - "**/*.ps1"
      - "*.lua"
      - "**/*.lua"
      - "*.dart"
      - "**/*.dart"
      - "*.sql"
      - "**/*.sql"
      - "*.vue"
      - "**/*.vue"
      - "*.svelte"
      - "**/*.svelte"
    tags: [code, assignment]

  - id: sensitive-json-assignment
    description: Quoted value of a secret-looking JSON/YAML key
    category: secret
    severity: high
    pattern: |-
      (?ix)
      ("?[A-Za-z0-9_.-]*(?:secret|token|passw(?:or)?d|pwd|api[_-]?key|access[_-]?key|private[_-]?key|client[_-]?secret|credential|authorization|auth[_-]?token|auth[_-]?key|salt|dsn|database[_-]?url|connection[_-]?string|session[_-]?secret|webhook[_-]?url)[A-Za-z0-9_.-]*"?\s*:\s*)
      ("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')
    flags: x
    group: 2
    strip_quotes: true
    placeholder: JSON_SECRET
    priority: 190
    tags: [json, yaml, assignment]

  - id: sensitive-json-bare-assignment
    description: Unquoted value of a secret-looking config key
    category: secret
    severity: high
    pattern: |-
      (?ix)
      ("?[A-Za-z0-9_.-]*(?:secret|token|passw(?:or)?d|pwd|api[_-]?key|access[_-]?key|private[_-]?key|client[_-]?secret|credential|authorization|auth[_-]?token|auth[_-]?key|salt|dsn|database[_-]?url|connection[_-]?string|session[_-]?secret|webhook[_-]?url)[A-Za-z0-9_.-]*"?\s*:\s*)
      ([^"'\s,}][^,}\s]*)
    flags: x
    group: 2
    placeholder: JSON_SECRET
    priority: 190
    paths:
      - "*.json"
      - "**/*.json"
      - "*.yaml"
      - "**/*.yaml"
      - "*.yml"
      - "**/*.yml"
      - "*.toml"
      - "**/*.toml"
      - "*.ini"
      - "**/*.ini"
      - "*.cfg"
      - "**/*.cfg"
      - "*.conf"
      - "**/*.conf"
      - "*.properties"
      - "**/*.properties"
      - "*.env"
      - "**/*.env"
      - ".env*"
      - "**/.env*"
      - "**/Dockerfile*"
      - "Dockerfile*"
      - "*.dockerfile"
      - "**/*.dockerfile"
      - "*.tfvars"
      - "**/*.tfvars"
    tags: [json, yaml, assignment]

  - id: authorization-bearer
    description: Bearer token in an Authorization header
    category: credential
    severity: high
    pattern: '(?i)\bBearer[ \t]+([A-Za-z0-9._~+/=-]{16,})'
    group: 1
    placeholder: BEARER_TOKEN
    priority: 20
    tags: [http, auth]

  - id: authorization-basic
    description: Basic authentication credentials
    category: credential
    severity: high
    pattern: '(?i)\bBasic[ \t]+([A-Za-z0-9+/=]{12,})'
    group: 1
    validate: basic_auth
    placeholder: BASIC_AUTH
    priority: 20
    tags: [http, auth]

  - id: url-credentials
    description: Username and password embedded in a URL
    category: credential
    severity: critical
    pattern: '(?i)(?P<scheme>[a-z][a-z0-9+.-]*://)(?P<userinfo>[^/@\s:]+:[^/@\s]+)@'
    group: userinfo
    placeholder: URL_CREDENTIALS
    priority: 20
    tags: [url, database, auth]

  - id: database-url-credentials
    description: Credentials in a database connection URL
    category: credential
    severity: critical
    pattern: '(?i)\b(?P<scheme>(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|rediss|amqp|amqps)://)(?P<userinfo>[^\s:@/]+:[^\s@/]+)@'
    group: userinfo
    placeholder: DB_CREDENTIALS
    priority: 15
    tags: [database, auth]

  - id: cli-secret-flag
    description: Secret passed as a command line flag
    category: secret
    severity: high
    pattern: '(?i)(?:^|\s)--?(?:password|passwd|pwd|token|api-?key|secret)(?:=|\s+)(?P<value>\S{6,})'
    group: value
    placeholder: CLI_SECRET
    priority: 25
    tags: [cli, auth]
